name: Render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      # No language runtime is installed on purpose: the demo deck executes no
      # chunk, its Python block being a static fence. Nor is there a CSS gate
      # step, the repo carrying no local stylelint toolchain by design.
      - name: Render example.qmd
        run: quarto render example.qmd

      # embed-resources leaves no example_files/ directory to collect.
      - uses: actions/upload-artifact@v7
        with:
          name: example-html
          path: example.html
          if-no-files-found: error
